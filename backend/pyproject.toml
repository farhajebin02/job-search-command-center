[project]
name = "job-command-center"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "livekit-agents[google]",
    "google-genai",
    "fastapi",
    "uvicorn[standard]",
    "python-dotenv",
    "pypdf",
    "httpx",
    "python-multipart",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "respx"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
